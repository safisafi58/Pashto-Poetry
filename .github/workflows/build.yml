name: Build Pashto Poetry - Two APKs in One ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.safisafi.pashtopoetry --project-name pashto_poetry /tmp/poetry_scaffold
            cp -R /tmp/poetry_scaffold/android ./android
          fi

      - name: Configure Android app flavors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          gradle = kts if kts.exists() else groovy
          if not gradle.exists():
              raise SystemExit("ERROR: Android app Gradle file was not generated.")

          source = gradle.read_text()
          if "productFlavors" not in source:
              if gradle.suffix == ".kts":
                  flavor_block = """
              flavorDimensions += "app"
              productFlavors {
                  create("user") {
                      dimension = "app"
                      applicationIdSuffix = ".user"
                      resValue("string", "app_name", "Pashto Poetry")
                  }
                  create("admin") {
                      dimension = "app"
                      applicationIdSuffix = ".admin"
                      resValue("string", "app_name", "Pashto Poetry Admin")
                  }
              }
          """
              else:
                  flavor_block = """
              flavorDimensions "app"
              productFlavors {
                  user {
                      dimension "app"
                      applicationIdSuffix ".user"
                      resValue "string", "app_name", "Pashto Poetry"
                  }
                  admin {
                      dimension "app"
                      applicationIdSuffix ".admin"
                      resValue "string", "app_name", "Pashto Poetry Admin"
                  }
              }
          """
              source = source.replace("android {", "android {\n" + flavor_block, 1)

          if gradle.suffix == ".kts":
              source = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", source)
          else:
              source = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", source)

          gradle.write_text(source)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              xml = manifest.read_text()
              xml = re.sub(r'android:label="[^"]+"', 'android:label="@string/app_name"', xml, count=1)
              manifest.write_text(xml)
          PY

      - name: Install Flutter packages
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib

      - name: Analyze all Flutter code
        run: flutter analyze --no-pub

      - name: Build User APK
        run: flutter build apk --release --flavor user --target lib/main_user.dart

      - name: Build Admin APK
        run: flutter build apk --release --flavor admin --target lib/main_admin.dart

      - name: Package both APKs into one ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          USER_APK="build/app/outputs/flutter-apk/app-user-release.apk"
          ADMIN_APK="build/app/outputs/flutter-apk/app-admin-release.apk"
          test -s "$USER_APK"
          test -s "$ADMIN_APK"
          cp "$USER_APK" "release/Pashto-Poetry-User.apk"
          cp "$ADMIN_APK" "release/Pashto-Poetry-Admin.apk"
          cat > release/README.txt <<'EOF'
          Pashto Poetry Android Apps

          1. Pashto-Poetry-User.apk: Public poetry reading app.
          2. Pashto-Poetry-Admin.apk: Private admin app for managing poems and categories.

          Install the User APK for readers. The Admin APK requires an authorized Supabase account with app_metadata.role = admin.
          Minimum Android version: Android 7.0 (API 24).
          EOF
          cd release
          zip -9 Pashto-Poetry-Two-Apps.zip Pashto-Poetry-User.apk Pashto-Poetry-Admin.apk README.txt
          unzip -t Pashto-Poetry-Two-Apps.zip
          ls -lh Pashto-Poetry-Two-Apps.zip Pashto-Poetry-User.apk Pashto-Poetry-Admin.apk

      - name: Upload one ZIP containing both apps
        uses: actions/upload-artifact@v4
        with:
          name: Pashto-Poetry-Two-Apps-ZIP
          path: release/Pashto-Poetry-Two-Apps.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
